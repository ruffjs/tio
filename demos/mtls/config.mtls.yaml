# mTLS Demo 配置文件
# 从仓库根目录复制本文件为 config.yaml，并复制 nats.mtls.yaml 到根目录后运行 tio。
# 注意：启用 mTLS 后，所有 MQTT 连接都需要使用 TLS 和客户端证书

api:
  port: 9000
  basicAuth:
    name: admin
    password: public

db:
  type: sqlite
  sqlite:
    filePath: tio.sqlite
    showSql: true

connector:
  type: nats
  natsConfigFile: ./nats.mtls.yaml
log:
  level: debug
