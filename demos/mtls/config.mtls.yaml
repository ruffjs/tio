# mTLS Demo configuration. Copy this to the repo root as config.yaml.
api:
  port: 9000
  basicAuth:
    name: admin
    password: public

db:
  type: sqlite
  sqlite:
    filePath: tio.sqlite
    showSql: true

connector:
  mqttBroker:
    tcpPort: 0
    tcpSslPort: 8883
    wsPort: 0
    certFile: "./demos/mtls/certs/server-cert.pem"
    keyFile: "./demos/mtls/certs/server-key.pem"
    clientCaFile: "./demos/mtls/certs/ca.pem"
    requireClientCert: true
    storage:
      type: file
      filePath: ./data/mqtt/comqtt.db
    superUsers:
      - name: $biz
        password: public
      - name: $tio
        password: public

nats:
  enabled: false

log:
  level: debug
