# NATS settings for the mTLS demo (disabled by default in config.mtls.yaml).
nats:
  enabled: false
  mode: embedded
  server:
    serverName: tio-node-1
    clusterName: tio
    port: 4222
    monitorPort: 8222
  appClient:
    user: $tio-app
    password: public
  systemClient:
    user: $tio-sys
    password: public
