# Tio IoT Hub Configuration
# This is the default configuration file embedded into the binary.
# Runtime config.yaml overrides these values.

api:
  # HTTP REST API port
  port: 9000
  # Enable CORS (Cross-Origin Resource Sharing) for web frontend
  cors: true
  # Basic authentication for HTTP API
  # If there is no configuration, there is no authentication
  basicAuth:
    name: admin
    password: public

db:
  # Database type: "sqlite" or "mysql"
  type: sqlite
  sqlite:
    # SQLite database file path, or ":memory:" for in-memory database
    filePath: tio.sqlite
    # Print SQL statements in log (for debugging)
    showSql: true
  mysql:
    host: 127.0.0.1
    port: 3306
    user: tio
    password: public
    db: tio
    charset: utf8
    # Timezone for MySQL connection (URL-encoded)
    timezone: Asia%2FShanghai
    # Maximum number of idle connections in the connection pool
    maxIdleConns: 4
    # Maximum number of open connections to the database
    maxOpenConns: 50
    # Maximum amount of time (seconds) a connection may be reused
    connMaxLifetime: 60
    showSql: true

protocol:
  # Default device control-message encoding: "json" or "cbor"; Thing.payloadEncoding overrides it in every mode
  defaultEncoding: json
  # Device protocol mode: "legacy", "simple", or "dual" (both, selected per Thing)
  mode: legacy

connector:
  # Connector type: "nats" (embedded NATS server with MQTT gateway)
  type: nats

# Shadow (device state) configuration
shadow:
  # List of shadow topics that should NOT include metadata in responses
  # Metadata includes timestamps and version information
  # Valid values: "/get/accepted", "/update/accepted", "/update/delta", "/update/documents"
  # Example: To exclude metadata from delta messages (for bandwidth optimization):
  #   ignoreMetadataFor: ["/update/delta"]
  ignoreMetadataFor: []
  # When true, a change anywhere under a top-level desired field
  # makes delta carry that whole field.
  fullFieldDelta: false

# Profiling configuration (for performance debugging)
pprof:
  # HTTP port for pprof endpoints (e.g., /debug/pprof/)
  port: 6060
  # Enable or disable pprof
  enabled: false

log:
  # Log level: "debug", "info", "warn", "error"
  level: debug
