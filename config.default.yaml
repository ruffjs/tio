api:
  port: 9000
  cors: true
  basicAuth:
    name: admin
    password: public

db:
  type: sqlite
  sqlite:
    filePath: tio.sqlite
    showSql: true
  mysql:
    host: 127.0.0.1
    port: 3306
    user: tio
    password: public
    db: tio
    charset: utf8
    timezone: Asia%2FShanghai
    maxIdleConns: 4
    maxOpenConns: 50
    connMaxLifetime: 60
    showSql: true

connector:
  type: nats
  nats:
    server:
      serverName: tio-node-1
      clusterName: tio
      port: 4222
      clusterPort: 6222
      clusterAdvertise: ""
      routes: []
      mqttPort: 1883
      wsPort: 8083
      monitorPort: 8222
      storeDir: ./data/nats/tio-node-1
      jetStreamMaxMemory: 268435456
      jetStreamMaxStore: 1073741824
      mqttStreamReplicas: 1
      presenceReplicas: 1
      clusterUser: $tio-route
      clusterPassword: public
      # Client TLS (NATS app/system client listener)
      clientTls: {}
      # MQTT device listener TLS; when configured, mqttPort uses TLS
      mqttTls: {}
      # WebSocket TLS; when empty, WebSocket runs in plaintext mode
      websocketTls: {}
      # Cluster route TLS; requires caFile, certFile, and keyFile
      routeTls: {}
    appClient:
      user: $tio-app
      password: public
    systemClient:
      user: $tio-sys
      password: public
    mqttPublisher:
      user: $tio-mqtt-publisher
      password: public
    superUsers:
      - name: $biz
        password: public

log:
  level: debug