# NATS config for integration tests, referenced by config-test.yaml.
# Disabled by default; setup_test.go turns embedded NATS on for the bridge path.
nats:
  enabled: false
  mode: embedded
  server:
    serverName: test-node
    clusterName: test
    port: -1
    monitorPort: 0
  appClient:
    user: $tio-app
    password: test
  systemClient:
    user: $tio-sys
    password: test
  jetStream:
    enabled: false
