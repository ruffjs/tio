# Tio IoT Hub Configuration
# Optional application overrides for the embedded defaults.
# NATS settings belong in the nats: block or the file referenced by nats.configFile.

api:
  # HTTP REST API port
  port: 9000
  # Enable CORS (Cross-Origin Resource Sharing) for web frontend
  cors: true
  # Basic authentication for HTTP API
  basicAuth:
    name: admin
    password: public

db:
  # Database type: "sqlite" or "mysql"
  type: sqlite
  sqlite:
    filePath: tio.sqlite
    showSql: true
  mysql:
    host: 127.0.0.1
    port: 3306
    user: tio
    password: public
    db: tio
    charset: utf8
    timezone: Asia%2FShanghai
    maxIdleConns: 4
    maxOpenConns: 50
    connMaxLifetime: 60
    showSql: true

connector:
  mqttBroker:
    tcpPort: 1883
    wsPort: 8083
    storage:
      type: file
      filePath: ./data/mqtt/comqtt.db
    superUsers:
      - name: $biz
        password: public
      - name: $tio
        password: public

# Optional NATS egress bridge. Disabled by default; tio runs on the embedded
# comqtt broker alone. See config-nats.default.yaml for all options.
# nats:
#   enabled: true
#   configFile: ./nats.yaml

protocol:
  # Default device control-message encoding: "json" or "cbor"
  # defaultEncoding: cbor
  # Device protocol mode: "legacy", "simple", or "dual"
  mode: dual

shadow:
  ignoreMetadataFor: []

pprof:
  port: 6060
  enabled: false

log:
  level: debug
