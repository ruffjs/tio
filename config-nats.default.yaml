# Tio NATS defaults, embedded into the binary at build time.
# Override with a top-level nats: block in the main config, or reference a
# separate file with nats.configFile (using this same nats: shape).
# Only include fields you want to override; lists replace the complete default list.
# Relative storage and certificate paths are resolved from the process working directory.
# NATS is optional: with enabled=false no NATS server is started and tio runs on
# the embedded comqtt broker alone.
nats:
  # Whether to start the optional NATS egress bridge at all.
  enabled: false
  # "embedded" starts an in-process NATS server; "external" connects to url.
  mode: embedded
  # External NATS server URL (external mode only).
  url: ""
  # Optional YAML file overriding these defaults (same nats: shape, relative to
  # the main config file).
  configFile: ""
  # JetStream persistence of the forwarded device uplinks and presence.
  jetStream:
    enabled: false
    # Directory for JetStream persistent storage (messages, streams, consumers).
    storeDir: ./data/nats
    # Maximum memory (bytes) for JetStream message storage.
    maxMemory: 268435456
    # Maximum disk storage (bytes) for JetStream.
    maxStore: 1073741824
    # Maximum age (seconds) of a retained message; 0 means unlimited.
    maxAgeSeconds: 0
    # Maximum number of messages per stream; 0 means unlimited.
    maxMsgs: 0
    # Maximum bytes per stream; 0 means unlimited.
    maxBytes: 0
    # Default consumer limit per JetStream stream. 0 uses the NATS default,
    # -1 disables the default limit.
    defaultMaxConsumers: 80000
  # Embedded NATS server settings (embedded mode).
  server:
    # Unique name for this NATS server node.
    serverName: tio-node-1
    # Cluster name shared by all nodes in the same cluster.
    clusterName: tio
    # NATS client connection port.
    port: 4222
    # NATS cluster port for inter-node communication; 0 disables clustering.
    clusterPort: 0
    # Address to advertise to other cluster members (empty = default bind).
    clusterAdvertise: ""
    # Cluster routes to connect to (multi-node deployments).
    routes: []
    # HTTP monitoring port for NATS server metrics; 0 disables it.
    monitorPort: 0
    # Username for cluster route authentication.
    clusterUser: $tio-route
    # Password for cluster route authentication.
    clusterPassword: public
    # Client TLS for the NATS client listener on port 4222.
    clientTls: {}
    # Cluster route TLS (requires caFile, certFile, and keyFile).
    routeTls: {}
  # Internal app client credentials (used by tio to publish to NATS).
  appClient:
    user: $tio-app
    password: public
  # Internal system client credentials.
  systemClient:
    user: $tio-sys
    password: public
