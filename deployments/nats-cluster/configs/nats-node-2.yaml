nats:
  server:
    serverName: tio-node-2
    clusterName: tio
    port: 4222
    clusterPort: 6222
    routes:
      - nats://tio-node-1:6222
      - nats://tio-node-3:6222
    monitorPort: 0
    clusterUser: $tio-route
    clusterPassword: public
  appClient:
    user: $tio-app
    password: public
  systemClient:
    user: $tio-sys
    password: public
  jetStream:
    enabled: true
    storeDir: ./data/nats/tio-node-2
    maxMemory: 268435456
    maxStore: 1073741824
