api:
  port: 9000
  cors: true
  basicAuth:
    name: admin
    password: public

db:
  type: mysql
  mysql:
    host: mysql
    port: 3306
    user: tio
    password: public
    db: tio
    charset: utf8
    timezone: Asia%2FShanghai
    maxIdleConns: 4
    maxOpenConns: 50
    connMaxLifetime: 60
    showSql: false

connector:
  type: nats
  natsConfigFile: ./nats-node-2.yaml
log:
  level: info
