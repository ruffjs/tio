api:
  port: 9000
  cors: true
  basicAuth:
    name: admin
    password: public

db:
  type: mysql
  mysql:
    host: mysql
    port: 3306
    user: tio
    password: public
    db: tio
    charset: utf8
    timezone: Asia%2FShanghai
    maxIdleConns: 4
    maxOpenConns: 50
    connMaxLifetime: 60
    showSql: false

connector:
  mqttBroker:
    tcpPort: 1883
    wsPort: 8083
    superUsers:
      - name: $biz
        password: public
      - name: $tio
        password: public

nats:
  enabled: true
  mode: embedded
  configFile: ./nats-node-2.yaml

log:
  level: info
